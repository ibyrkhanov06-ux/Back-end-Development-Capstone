apiVersion: apps/v1
kind: Deployment
metadata:
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: djangoserver
  template:
    metadata:
      labels:
        app: djangoserver
    spec:
      containers:
        - name: djangoserver
          image: us.icr.io/sn-labs-u240301/djangoserver:1
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_DEBUG
              value: "0"
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-config
                  key: secret-key
            - name: SONGS_URL
              value: "http://songs:8080"
            - name: PICTURES_URL
              value: "https://pictures.2giq22bowt9u.us-south.codeengine.appdomain.cloud"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: djangoserver
spec:
  selector:
    app: djangoserver
  ports:
    - port: 8000
      targetPort: 8000
